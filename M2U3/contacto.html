<body>

  

    <form class="row g-3 needs-validation formulario-contacto" novalidate>

      <h1>Escribinos</h1>
  <div class="col-md-4">
    <label for="validationCustom01" class="form-label">Primer nombre</label>
    <input type="text" class="form-control" id="validationCustom01" value="" required>
    <div class="valid-feedback">
      Correcto
    </div>
  </div>
  <div class="col-md-4">
    <label for="validationCustom02" class="form-label">Apellido</label>
    <input type="text" class="form-control" id="validationCustom02" value="" required>
    <div class="valid-feedback">
      Correcto
    </div>
  </div>
  
    </div>
  </div>
 

<div class="col-md-4">
    <label for="validationCustomUsername" class="form-label">Correo electrónico</label>
    <div class="input-group has-validation">
      <span class="input-group-text" id="inputGroupPrepend">@</span>
      <input type="text" class="form-control" id="validationCustomUsername" aria-describedby="inputGroupPrepend" required>
      <div class="invalid-feedback">
        Correo inválido.
      </div>
  </div>
  </div>

 <div class="col-md-6">
    <label for="validationCustom03" class="form-label">Mensaje</label>
    <input type="text" class="form-control" id="validationCustom03" required>
    <div class="invalid-feedback">
      Su mensaje debe tener más de 5 palabras.
    </div>
  </div>






  <div class="col-12">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="" id="invalidCheck" required>
      <label class="form-check-label" for="invalidCheck">
        Suscribirse al Newsletter
      </label>
      <div class="invalid-feedback">
        No recibirás información de Mundo Galgo.
      </div>
    </div>
  </div>
  <div class="col-12">
    <button class="btn btn-primary" type="submit">Enviar</button>
  </div>
</form>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>   
</body>
